; Servicos graficos do Cliente_Linux (gerenciados pelo supervisord)

[program:vnc]
; Servidor grafico virtual :1 (so aceita conexoes locais, senha = cliente123)
command=/usr/bin/Xtigervnc :1 -geometry 1600x900 -depth 24 -rfbport 5901 -localhost -SecurityTypes VncAuth -rfbauth /home/cliente/.vnc/passwd -AlwaysShared
user=cliente
environment=HOME="/home/cliente",USER="cliente"
priority=10
autorestart=true
stdout_logfile=/var/log/supervisor/vnc.log
redirect_stderr=true

[program:xfce]
; Sessao XFCE do usuario cliente (reinicia se o usuario sair)
command=/usr/bin/dbus-run-session -- /usr/bin/startxfce4
user=cliente
environment=HOME="/home/cliente",USER="cliente",DISPLAY=":1",LANG="pt_BR.UTF-8"
priority=20
startsecs=5
autorestart=true
stdout_logfile=/var/log/supervisor/xfce.log
redirect_stderr=true

[program:novnc]
; Ponte navegador -> VNC: http://localhost:6080
command=/usr/bin/websockify --web /usr/share/novnc 6080 localhost:5901
user=cliente
priority=30
autorestart=true
stdout_logfile=/var/log/supervisor/novnc.log
redirect_stderr=true
